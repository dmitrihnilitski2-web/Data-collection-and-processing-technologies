<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESS RL Agent Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo-placeholder">BESS AI</div>
            <nav>
                <button class="nav-btn active">Дашборд</button>
            </nav>
            <div class="controls">
                <button id="trainBtn" class="btn-primary">Навчити Агента</button>
                <button id="stepBtn" class="btn-secondary" disabled>Зробити крок (1 год)</button>
                <button id="autoPlayBtn" class="btn-secondary" disabled>Авто-симуляція</button>
            </div>
            <div id="statusText" class="status-indicator">Очікування навчання...</div>
        </aside>

        <main class="main-content">
            <header>
                <h1>BESS Overview</h1>
                <div class="user-profile">Agent Status: <span id="agentStatusLabel" class="offline">Offline</span></div>
            </header>

            <section class="stats-grid">
                <div class="stat-card glow-purple">
                    <h3>Поточна Година</h3>
                    <p id="hourVal" class="stat-value">00:00</p>
                </div>
                <div class="stat-card">
                    <h3>Заряд Батареї (SOC)</h3>
                    <p id="socVal" class="stat-value">0.0 кВт</p>
                </div>
                <div class="stat-card">
                    <h3>Поточний Тариф</h3>
                    <p id="tariffVal" class="stat-value">0.0 ₴</p>
                </div>
                <div class="stat-card">
                    <h3>Остання Дія</h3>
                    <p id="actionVal" class="stat-value highlight">None</p>
                </div>
            </section>

            <div class="bottom-grid">
                <section class="chart-section card">
                    <div class="card-header">
                        <h2>Динаміка роботи агента</h2>
                    </div>
                    <div class="chart-container">
                        <canvas id="bessChart"></canvas>
                    </div>
                </section>

                <section class="transactions-section card">
                    <div class="card-header">
                        <h2>Останні події</h2>
                        <h3 id="totalSavings" class="total-savings">Економія: 0.00 ₴</h3>
                    </div>
                    <ul id="logList" class="log-list">
                        </ul>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
